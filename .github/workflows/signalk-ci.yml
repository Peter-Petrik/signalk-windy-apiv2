# ─────────────────────────────────────────────────────────────
# SignalK Plugin CI
#
# It calls the shared SignalK workflow which tests the plugin
# across Linux, Linux arm64, macOS, and Windows (Node 22 + 24).
#
# The Signal K integration test starts a real Signal K server with
# sample data, installs the plugin and enables it with an empty
# configuration, then runs `npm run test:integration`. Without
# credentials the plugin sends nothing, and the integration check
# saves no configuration, so no CI run sends a request to Windy.
#
# The server versions are the current release and the two before
# it. The two pinned versions need moving forward by hand when a
# new server version is released.
#
# It can also be triggered manually from the GitHub Actions UI
# with custom settings (Node versions, server versions).
#
# The file follows the caller example in the Signal K server
# repository: docs/develop/plugins/examples/plugin-caller-example.yml
# ─────────────────────────────────────────────────────────────

name: SignalK Plugin CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      test-command:
        description: Command to run tests
        required: false
        default: npm test
        type: string
      build-command:
        description: Command to build the plugin
        required: false
        default: npm run build --if-present
        type: string
      format-check-command:
        description: 'Optional blocking format check, e.g. npm run prettier:check'
        required: false
        default: ''
        type: string
      coverage-command:
        description: 'Optional coverage command (replaces the test run), e.g. npm run coverage'
        required: false
        default: ''
        type: string
      node-versions:
        description: 'JSON array of Node versions, example: ["22","24"]'
        required: false
        default: '["22", "24"]'
        type: string
      enable-signalk-integration:
        description: Start SignalK server and install plugin for integration testing
        required: false
        default: true
        type: boolean
      signalk-server-versions:
        description: 'JSON array of signalk-server versions for integration testing, e.g. ["2.23.0","latest"]'
        required: false
        default: '["latest"]'
        type: string

jobs:
  # ── Automatic runs (push / pull request) ──────────────────
  test-plugin-auto:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      test-command: npm test
      build-command: npm run build --if-present
      node-versions: '["22", "24"]'
      enable-signalk-integration: true
      signalk-server-versions: '["2.32.0", "2.33.0", "latest"]'

  # ── Manual runs (workflow_dispatch with custom inputs) ────
  test-plugin-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      test-command: ${{ inputs.test-command }}
      build-command: ${{ inputs.build-command }}
      format-check-command: ${{ inputs.format-check-command }}
      coverage-command: ${{ inputs.coverage-command }}
      node-versions: ${{ inputs.node-versions }}
      enable-signalk-integration: ${{ inputs.enable-signalk-integration }}
      signalk-server-versions: ${{ inputs.signalk-server-versions }}
